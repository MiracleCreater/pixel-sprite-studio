<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新手引导 · MyPixelTool</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#fff; --line:#e7e9f2; --text:#1d2132; --muted:#6b7185;
    --primary:#5b5bd6; --primary-2:#7c6cf0; --primary-soft:#eeeefe;
    --ok:#12a26a; --ok-soft:#e9f8f1; --warn:#d97706; --warn-soft:#fff7ed;
    --err:#dc2626; --err-soft:#fef2f2; --radius:14px;
    --shadow:0 1px 2px rgba(24,28,50,.05), 0 8px 24px rgba(24,28,50,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  header{height:60px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-2));
    display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:6px}
  .logo-mark i{background:rgba(255,255,255,.92);border-radius:1px}
  .logo-mark i:nth-child(2),.logo-mark i:nth-child(3){opacity:.55}
  .logo h1{font-size:16px;margin:0;letter-spacing:.3px}
  .logo span{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
    background:#f3f4f8;font-size:12.5px;color:var(--muted);border:1px solid var(--line)}
  .pill.ok{background:var(--ok-soft);border-color:#bfe8d5;color:#0b7d52;font-weight:600}
  .pill.work{background:var(--primary-soft);border-color:#d8d6fb;color:var(--primary);font-weight:600}

  main{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;
    max-width:1000px;margin:22px auto 70px;padding:0 20px;align-items:start}

  /* 左侧步骤导航 */
  nav{position:sticky;top:82px;display:flex;flex-direction:column;gap:2px;background:#fff;
    border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
  .nav-item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;
    border:none;background:transparent;text-align:left;color:#3d4258;transition:.15s}
  .nav-item:hover{background:#f7f7fd}
  .nav-item.on{background:var(--primary-soft);color:var(--primary)}
  .nav-item .num{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:11.5px;font-weight:700;background:#eef0f6;color:#7c8299;margin-top:1px}
  .nav-item.on .num{background:var(--primary);color:#fff}
  .nav-item.ok .num{background:var(--ok);color:#fff}
  .nav-item.warn .num{background:var(--warn);color:#fff}
  .nav-item.fail .num{background:var(--err);color:#fff}
  .nav-item.busy .num{background:var(--primary);color:#fff;animation:pulse 1.2s infinite}
  .nav-item .t{font-size:13px;line-height:1.35}
  .nav-item .s{font-size:11px;color:var(--muted);margin-top:2px}
  .nav-item.on .s{color:#6f6fd8}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* 右侧主区 */
  .pane{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:24px 26px 20px;min-height:440px}
  .pane-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .step-chip{font-size:11.5px;color:var(--primary);background:var(--primary-soft);
    border-radius:999px;padding:2px 10px;font-weight:600}
  .opt{font-size:11.5px;color:var(--muted);background:#f3f4f8;border-radius:999px;padding:2px 10px}
  .pane h1{font-size:20px;margin:6px 0 16px;letter-spacing:.2px}

  .banner{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border-radius:12px;
    border:1px solid var(--line);background:#f8f9fc;margin-bottom:16px}
  .banner.ok{background:var(--ok-soft);border-color:#c6ecd9}
  .banner.warn{background:var(--warn-soft);border-color:#f8ddb8}
  .banner.fail{background:var(--err-soft);border-color:#f7d3d3}
  .banner.busy{background:var(--primary-soft);border-color:#dcdafb}
  .bicon{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:14px;font-weight:700;color:#fff;background:#9aa0b8;margin-top:1px}
  .banner.ok .bicon{background:var(--ok)}
  .banner.warn .bicon{background:var(--warn)}
  .banner.fail .bicon{background:var(--err)}
  .banner.busy .bicon{background:var(--primary)}
  .banner b{display:block;font-size:13.5px;margin-bottom:2px}
  .banner.ok b{color:#0b7d52} .banner.warn b{color:#9a3412}
  .banner.fail b{color:#a01c1c} .banner.busy b{color:#4340a8}
  .btext{color:#4b5070;font-size:13px}

  .rows{margin:0 0 16px;border-top:1px dashed var(--line)}
  .row{display:flex;justify-content:space-between;gap:16px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13px}
  .row .k{color:var(--muted);flex:none}
  .row .v{text-align:right;color:#2b3050;word-break:break-all}
  .row .v.bad{color:var(--err);font-weight:600}

  .acts{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
  .btn{border:none;border-radius:11px;padding:11px 20px;font-weight:600;font-size:13.5px;transition:.16s}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
    box-shadow:0 6px 16px rgba(91,91,214,.28)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:#40465c}
  .btn.ghost:hover{border-color:#cfd2e4;background:#fafafe}
  .btn.sm{padding:7px 14px;font-size:12.5px;border-radius:9px}

  .fixbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfbfe;margin-bottom:16px}
  .fixbox h3{margin:0 0 10px;font-size:13px;color:#2b3050;display:flex;align-items:center;gap:7px}
  .fixbox h3 .tag{font-size:11px;background:var(--primary-soft);color:var(--primary);
    border-radius:999px;padding:1px 8px;font-weight:600}
  .fixbox ol{margin:0;padding-left:20px;color:#454a63;font-size:13px}
  .fixbox li{margin:5px 0}
  .fixbox li::marker{color:var(--primary);font-weight:700}

  .prog{height:9px;border-radius:99px;background:#eceef5;overflow:hidden;margin:4px 0 8px}
  .prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary-2));
    transition:width .4s ease;width:0}
  .plog{margin-top:6px;max-height:120px;overflow:auto;background:#0f1220;border-radius:10px;padding:8px 11px;
    font:11.5px/1.7 ui-monospace,Consolas,monospace;color:#c8cee6}
  .plog div{white-space:pre-wrap;word-break:break-word}

  .shot{margin:4px 0 14px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .shot .frame{width:200px;height:200px;border-radius:12px;border:1px solid var(--line);overflow:hidden;
    background:#fff repeating-conic-gradient(#f0f1f7 0 25%,#fff 0 50%) 0 0/16px 16px;display:grid;place-items:center}
  .shot .frame img{max-width:100%;max-height:100%;image-rendering:pixelated}
  .shot .note{flex:1;min-width:180px;font-size:12.5px;color:var(--muted);line-height:1.7}

  .foot{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .foot .hint{flex:1;font-size:12px;color:var(--muted)}
  .hidden{display:none !important}

  /* 完成页 */
  .done-hero{text-align:center;padding:18px 8px 6px}
  .done-hero .ring{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
    background:var(--ok-soft);border:2px solid #bfe8d5;font-size:32px;color:var(--ok)}
  .done-hero h2{margin:0 0 8px;font-size:22px}
  .done-hero p{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .next-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;text-align:left;margin:0 0 24px}
  .next-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfbfe}
  .next-card b{display:block;font-size:13px;margin-bottom:3px}
  .next-card span{font-size:12px;color:var(--muted);line-height:1.6}

  .toast{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:99}
  .toast div{background:#14182b;color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;
    box-shadow:0 10px 30px rgba(10,12,25,.28);animation:in .22s ease}
  .toast div.err{background:#7f1d1d}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (max-width:820px){
    main{grid-template-columns:1fr;gap:12px}
    nav{position:static;flex-direction:row;overflow:auto;padding:8px}
    .nav-item{flex:none;padding:7px 9px}
    .nav-item .s{display:none}
    .pane{padding:18px 16px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"><i></i><i></i><i></i><i></i></div>
    <h1>MyPixelTool</h1><span>新手引导</span>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="overall">检测中…</span>
  <button class="btn ghost sm" onclick="skipAll()">跳过，直接用</button>
</header>

<main>
  <nav id="nav"></nav>
  <section class="pane" id="pane">
    <div class="banner busy"><span class="bicon">…</span><div><b>正在检查这台电脑</b>
      <div class="btext">大概需要几秒，第一次会慢一点。</div></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const META = {
  ok:   {icon:"✓", title:"这一步通过了"},
  warn: {icon:"!", title:"可以用，但有一点要注意"},
  fail: {icon:"×", title:"这一步还没通过"},
  busy: {icon:"…", title:"正在处理，别关掉这个页面"},
  todo: {icon:"·", title:"还没做，建议做一下"},
};
const SUB = {ok:"已通过", warn:"注意", fail:"待处理", busy:"进行中", todo:"未开始"};

let data = null;
let cur = null;          // null = 还没定位，首次加载后跳到第一个待处理的步骤
let timer = null;
let lanOpen = false;     // 「怎么连别的电脑」展开状态，跨轮询保持
let lastSig = "";

function toast(msg, isErr){
  const box = document.getElementById("toast");
  const d = document.createElement("div");
  if(isErr) d.className = "err";
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(()=>d.remove(), 3200);
}

async function load(force){
  try{
    const r = await fetch("/api/wizard" + (force ? "?force=1" : ""));
    data = await r.json();
  }catch(e){
    document.getElementById("pane").innerHTML =
      `<div class="banner fail"><span class="bicon">×</span><div><b>连不上本地服务</b>
       <div class="btext">这个页面是由 MyPixelTool 的服务端提供的。如果服务端被关了，双击「启动网页界面.bat」重新打开。</div></div></div>`;
    setTimeout(()=>load(false), 4000);
    return;
  }
  if(!data.steps || !data.steps.length) return;

  // 首次进来：已就绪就展示完成页；否则直接定位到第一个需要处理的地方，省得用户自己找
  if(cur === null){
    if(data.ready){
      cur = data.steps.length - 1;
    }else{
      const i = data.steps.findIndex(s => s.id === data.firstBad);
      cur = i >= 0 ? i : 0;
    }
  }
  if(cur >= data.steps.length) cur = data.steps.length - 1;

  // 内容没变就不重绘：避免用户正在读字/翻日志时页面被刷掉
  const sig = JSON.stringify(data.steps.map(s => [s.id, s.state, s.headline]))
    + "|" + Math.round((data.download && data.download.pct) || 0)
    + "|" + ((data.download && data.download.line) || "")
    + "|" + ((data.comfy && data.comfy.log || []).length)
    + "|" + ((data.test && data.test.log || []).length)
    + "|" + (data.test && data.test.hasPng ? 1 : 0)
    + "|" + cur + "|" + lanOpen;

  if(sig !== lastSig){
    lastSig = sig;
    renderNav();
    renderPane();
    const box = document.querySelector(".plog");
    if(box) box.scrollTop = box.scrollHeight;
  }
  renderOverall();
  schedule();
}

function schedule(){
  clearTimeout(timer);
  const anyBusy = (data.steps || []).some(s => s.state === "busy");
  timer = setTimeout(()=>load(false), anyBusy ? 1500 : 9000);
}

function renderOverall(){
  const el = document.getElementById("overall");
  el.classList.remove("ok", "work");
  if(data.ready){
    el.classList.add("ok");
    el.textContent = "环境就绪";
  }else{
    const bad = data.steps.filter(s => !s.optional && (s.state === "fail" || s.state === "todo")).length;
    el.classList.add("work");
    el.textContent = bad ? `还有 ${bad} 步要处理` : "环境检查中…";
  }
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = data.steps.map((s, i) => `
    <button class="nav-item ${s.state} ${i === cur ? "on" : ""}" onclick="go(${i})">
      <span class="num">${s.state === "ok" ? "✓" : (i + 1)}</span>
      <span><span class="t">${esc(s.title)}</span><span class="s">${SUB[s.state] || ""}</span></span>
    </button>`).join("");
}

function go(i){
  cur = i;
  lastSig = "";
  renderNav();
  renderPane();
  window.scrollTo({top:0, behavior:"smooth"});
}

function idxOf(id){
  const i = (data.steps || []).findIndex(s => s.id === id);
  return i >= 0 ? i : cur;
}

function renderPane(){
  const s = data.steps[cur];
  const meta = META[s.state] || META.todo;
  const pane = document.getElementById("pane");

  let html = `
    <div class="pane-top">
      <span class="step-chip">第 ${cur + 1} 步 / 共 ${data.steps.length} 步</span>
      ${s.optional ? '<span class="opt">可跳过</span>' : ""}
    </div>
    <h1>${esc(s.title)}</h1>
    <div class="banner ${s.state}">
      <span class="bicon">${meta.icon}</span>
      <div><b>${meta.title}</b><div class="btext">${esc(s.headline)}</div></div>
    </div>`;

  if(s.detail && s.detail.length){
    html += `<div class="rows">${s.detail.map(d =>
      `<div class="row"><span class="k">${esc(d.k)}</span>
       <span class="v ${d.bad ? "bad" : ""}">${esc(d.v)}</span></div>`).join("")}</div>`;
  }

  // 下载进度
  if(s.id === "models" && data.download && data.download.busy){
    html += `<div class="prog"><i style="width:${Math.max(2, data.download.pct || 0)}%"></i></div>`;
    html += `<div style="font-size:12.5px;color:#6b7185">${esc(data.download.line || "建立连接…")}</div>`;
    html += logBox(data.download.log);
  }
  if(s.id === "comfy" && data.comfy && data.comfy.busy){
    html += logBox(data.comfy.log);
  }
  if(s.id === "test"){
    if(data.test && data.test.busy) html += logBox(data.test.log);
    if(data.test && data.test.hasPng){
      html += `<div class="shot">
        <div class="frame"><img src="/api/wizard/test.png?t=${Date.now()}" alt="试画结果"></div>
        <div class="note"><b style="color:#1d2132">这就是刚才画的像素角色</b><br>
          看到图说明：模型加载正常、ComfyUI 正常、内存暂存正常。<br>
          正式创作时用同样的流程，只是分辨率更高、能一次出多张。</div>
      </div>`;
    }
  }

  if(s.actions && s.actions.length){
    html += `<div class="acts">${s.actions.map(a => `
      <button class="btn ${a.kind === "primary" ? "primary" : "ghost"}"
        onclick="act('${a.id}', this)">${esc(a.label)}</button>`).join("")}</div>`;
  }

  if(s.fix && s.fix.length){
    html += `<div class="fixbox">
      <h3>怎么改 <span class="tag">${s.state === "ok" ? "小提示" : "照着做就行"}</span></h3>
      <ol>${s.fix.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    </div>`;
  }

  if(s.id === "gpu"){
    html += `<div class="fixbox ${lanOpen ? "" : "hidden"}" id="lanHelp">
      <h3>用另一台有显卡的电脑当「服务端」</h3>
      <ol>
        <li>在那台有 NVIDIA 显卡的电脑上装好本工具，双击「启动服务端(局域网).bat」</li>
        <li>那个窗口会显示一个 <code>http://192.168.x.x:8899</code> 的地址，抄下来</li>
        <li>在这台电脑（或平板、手机）的浏览器里打开这个地址，就能用全部功能</li>
        <li>两台机器要在同一个路由器 / Wi-Fi 下；公司网络可能挡了 8899 端口</li>
      </ol>
    </div>`;
  }

  const nextDisabled = (s.state === "fail" && !s.optional) ? "disabled" : "";
  const nextHint = (s.state === "fail" && !s.optional)
    ? "先把这一步处理好，再往下走"
    : (s.state === "busy" ? "等它跑完会自动更新"
      : (s.state === "ok" ? "这一步没问题，可以继续" : ""));

  let tail;
  if(cur < data.steps.length - 1){
    tail = `<button class="btn primary" onclick="go(${cur + 1})" ${nextDisabled}>下一步 →</button>`;
  }else if(data.ready){
    tail = `<button class="btn primary" onclick="finish()">完成，开始创作 →</button>`;
  }else{
    tail = `<button class="btn primary" disabled>还有问题没处理完</button>`;
  }

  html += `<div class="foot">
    <button class="btn ghost sm" onclick="go(${Math.max(0, cur - 1)})" ${cur === 0 ? "disabled" : ""}>← 上一步</button>
    <span class="hint">${!data.ready && cur === data.steps.length - 1 ? "回到前面带红色标记的步骤处理一下" : nextHint}</span>
    ${tail}
  </div>`;

  pane.innerHTML = html;
}

function logBox(lines){
  if(!lines || !lines.length) return "";
  return `<div class="plog">${lines.map(l => `<div>${esc(l)}</div>`).join("")}</div>`;
}

async function act(id, btn){
  if(id === "lan_help"){
    lanOpen = !lanOpen;
    const el = document.getElementById("lanHelp");
    if(el) el.classList.toggle("hidden", !lanOpen);
    lastSig = "";          // 让下一次轮询按新状态重绘
    return;
  }
  const map = {download_lite:"download_lite", download_full:"download_full"};
  if(btn){ btn.disabled = true; btn.textContent = "处理中…"; }
  try{
    const r = await fetch("/api/wizard/action", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action: map[id] || id})
    });
    const j = await r.json();
    if(!r.ok || j.error){ toast(j.error || "操作失败", true); }
    else if(id === "test_image"){ toast("开始试画，大约 30~90 秒"); cur = idxOf("test"); }
    else if(id.startsWith("download")){ toast("已开始下载，可以先去忙别的"); cur = idxOf("models"); }
    else if(id === "start_comfy"){ toast("正在启动 ComfyUI，请稍等"); cur = idxOf("comfy"); }
    else if(id.startsWith("open_")){ toast("已打开文件夹"); }
  }catch(e){
    toast("操作失败：" + e.message, true);
  }
  await load(true);
}

function finish(){
  localStorage.setItem("pixel_wizard_done", "1");
  localStorage.setItem("pixel_wizard_done_at", new Date().toISOString());
  location.href = "/";
}

function skipAll(){
  localStorage.setItem("pixel_wizard_done", "1");
  localStorage.setItem("pixel_wizard_skipped", "1");
  location.href = "/";
}

/* 完成态：所有必须步骤都通过时，把内容换成收尾页 */
const _renderPane = renderPane;
renderPane = function(){
  const s = data.steps[cur];
  if(data.ready && cur === data.steps.length - 1 && s.state !== "fail"){
    const t = data.steps.find(x => x.id === "test") || {};
    const tip = (t.state === "todo")
      ? `<div class="next-card" style="grid-column:1/-1;background:#fff7ed;border-color:#f8ddb8">
           <b>还没试画过（可选，但建议做）</b>
           <span>试画会用最小分辨率真画一张，30~90 秒。看到图就说明模型、服务、显存全都正常，
           之后正式出图心里有底。</span>
           <div class="acts" style="margin:10px 0 0">
             <button class="btn ghost sm" onclick="go(idxOf('test'))">去试画一张</button>
           </div>
         </div>`
      : "";
    document.getElementById("pane").innerHTML = `
      <div class="done-hero">
        <div class="ring">✓</div>
        <h2>全部就绪，可以开始了</h2>
        <p>从这一刻起，你不用再管命令行和模型文件了 —— 打开界面点按钮就行。</p>
      </div>
      <div class="next-grid">
        <div class="next-card"><b>1. 出角色图</b><span>填一句角色描述，一次出几张候选，挑一张最顺眼的。</span></div>
        <div class="next-card"><b>2. 选动作</b><span>站立、行走、攻击……勾几个动作，程序自动生成像素动画。</span></div>
        <div class="next-card"><b>3. 挂机批量</b><span>把多个角色丢进队列，关掉页面它也会一直跑。</span></div>
        ${tip}
      </div>
      <div class="acts" style="justify-content:center">
        <button class="btn primary" onclick="finish()">开始创作 →</button>
        <button class="btn ghost" onclick="go(0)">再看看检查结果</button>
      </div>`;
    return;
  }
  _renderPane();
};

cur = null;
load(true);
</script>
</body>
</html>
